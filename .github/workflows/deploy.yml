name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch a short-lived IGDB access token
        id: igdb_token
        run: |
          if [ -n "${{ secrets.IGDB_CLIENT_ID }}" ] && [ -n "${{ secrets.IGDB_CLIENT_SECRET }}" ]; then
            TOKEN=$(curl -sf -X POST "https://id.twitch.tv/oauth2/token" \
              -d "client_id=${{ secrets.IGDB_CLIENT_ID }}" \
              -d "client_secret=${{ secrets.IGDB_CLIENT_SECRET }}" \
              -d "grant_type=client_credentials" | jq -r '.access_token // empty')
            if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=" >> "$GITHUB_OUTPUT"
          fi
        # Only the resulting access token (not the Twitch client secret)
        # gets passed to the build below — it's what ends up in the bundle.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}
          VITE_IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          VITE_IGDB_ACCESS_TOKEN: ${{ steps.igdb_token.outputs.token }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
